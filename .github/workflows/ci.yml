name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint e tipos
        run: |
          npm run lint
          npm run typecheck

      - name: Planilhas sintéticas (xlsxwriter)
        run: pip install xlsxwriter

      - name: Chromium para os testes de interface
        run: npx playwright install --with-deps chromium

      - name: Build e testes
        run: npm test
